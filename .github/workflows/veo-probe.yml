name: Veo test (one short clip)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: finance-ai-shorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: AnimMouse/setup-ffmpeg@v1
      - run: pip install requests pillow
      - name: Try Veo
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: python -u -m pipeline.veo --probe
      - name: Save result
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/veo_probe.log state/veo_sample.mp4 2>/dev/null || true
          git commit -m "Veo test result" || exit 0
          git pull --rebase --autostash && git push
