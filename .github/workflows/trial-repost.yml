name: Re-post old Reels as Trial Reels

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Run IDs of past 'Daily finance Shorts' runs (comma-separated; videos are kept 7 days)"
        type: string
        required: true

permissions:
  contents: write             # to save the Trial Reel links in posting history
  actions: read               # to download the old runs' videos

concurrency:
  group: shorts
  cancel-in-progress: false

defaults:
  run:
    working-directory: finance-ai-shorts

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: finance-ai-shorts/requirements.txt

      - name: Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Install Python packages
        run: pip install requests pyyaml

      - name: Download the old videos
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          for id in $(echo "$RUN_IDS" | tr ',' ' '); do
            gh run download "$id" -R "${{ github.repository }}" -D "videos/$id"
          done
          find videos -name '*.mp4' | sort

      - name: Post them as Trial Reels
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -u tools/trial_repost.py videos

      - name: Save posting history
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Trial Reel links"
            git pull --rebase --autostash || true
            git push
          fi
